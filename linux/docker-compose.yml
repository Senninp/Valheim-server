# Serveur dedie Valheim via Docker (Linux / NAS / mini-PC).
# Image : https://github.com/lloesche/valheim-server-docker
# Usage : cp .env.example .env && nano .env && docker compose up -d
services:
  valheim:
    image: ghcr.io/lloesche/valheim-server
    container_name: valheim
    restart: unless-stopped
    stop_grace_period: 2m   # laisse le temps au serveur de sauvegarder le monde
    cap_add:
      - sys_nice
    ports:
      - "2456-2457:2456-2457/udp"
    environment:
      SERVER_NAME: ${SERVER_NAME}
      WORLD_NAME: ${WORLD_NAME}
      SERVER_PASS: ${SERVER_PASS}
      SERVER_PUBLIC: ${SERVER_PUBLIC:-false}
      SERVER_ARGS: ${SERVER_ARGS:-}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./config:/config   # mondes + sauvegardes (config/worlds_local, config/backups)
      - ./data:/opt/valheim   # fichiers du serveur
